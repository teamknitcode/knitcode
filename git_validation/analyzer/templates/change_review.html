<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KnitCode 변경 검토</title>
<style>
:root{color-scheme:dark;--bg:#101824;--card:#192638;--line:#33465f;--text:#e4edf8;--muted:#a6b8ce;--accent:#8ce1c4;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}main{max-width:1440px;margin:auto;padding:32px 24px 64px}h1{font-size:32px;margin:10px 0}h2{font-size:20px;margin:24px 0 12px}p{line-height:1.7;color:var(--muted)}a{color:#8ed2ff}small{color:var(--muted)}nav,.stats,.toolbar,.tabs{display:flex;gap:12px;flex-wrap:wrap}nav{margin:24px 0}nav a{border:1px solid var(--line);padding:10px 16px;border-radius:8px;text-decoration:none}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;flex:1;min-width:140px}.card strong{display:block;font-size:30px;color:var(--accent);margin-bottom:4px}.sha{font-family:monospace;overflow-wrap:anywhere;font-size:13px}.tabs{margin-top:26px;gap:6px}button,input,select{font:inherit;border:1px solid var(--line);border-radius:8px;padding:11px 14px;background:var(--card);color:var(--text)}button{cursor:pointer}button[aria-selected=true]{background:var(--accent);color:#10221c;border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid #8ed2ff;outline-offset:3px}.toolbar{margin:18px 0}input{flex:1;min-width:180px}.box{overflow-x:auto;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:13px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}th{background:#1d2c40;color:#b9cce4;white-space:nowrap}tr:last-child td{border-bottom:0}td{overflow-wrap:anywhere;min-width:100px}td:first-child{min-width:240px}summary{cursor:pointer;line-height:1.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0e1622;border:1px solid #2c3d53;border-radius:6px;padding:12px;font-size:12px;line-height:1.6;max-height:420px;overflow:auto}li{line-height:1.7;margin:7px 0}.notice{background:#273027;border-left:3px solid var(--accent);padding:10px 16px;margin:18px 0}.warning{color:#ffca8a}.empty{padding:24px;color:var(--muted)}.side{font-family:monospace;font-size:12px;color:#8ed2ff}.caption{font-size:13px}@media(max-width:600px){main{padding:20px 14px}h1{font-size:26px}.card{min-width:42%;padding:12px}.card strong{font-size:25px}.toolbar{flex-direction:column}.tabs button{flex:1 0 30%;font-size:13px;padding:10px}th,td{padding:10px}}
</style></head>
<body><main>
<small>KNITCODE / CHANGE REVIEW</small><h1>이번 변경에서 확인할 코드</h1><p id="repo"></p><div class="sha" id="revisions"></div>
<nav><a href="git/report.html">GitHub·Git 변경 분석 ↗</a><a href="base/report.html">변경 전 정적분석 ↗</a><a href="head/report.html">변경 후 정적분석 ↗</a><a href="change_review.json">전체 JSON ↗</a></nav>
<div id="stats" class="stats"></div>
<p class="notice">결함 판정이 아닌 검토 후보입니다. 호출 경로는 정적 추론이며, 동시 수정 추천은 비교 시작 커밋까지의 과거 이력만 사용합니다.</p>
<div class="tabs" role="tablist" aria-label="분석 종류" id="tabs"></div>
<div class="toolbar"><input type="search" id="search" placeholder="파일, 함수, 작성자, 근거 검색" aria-label="분석 결과 검색"><select id="side" aria-label="분석 시점"><option value="">두 시점 모두</option><option value="head">head · 변경 후</option><option value="base">base · 변경 전</option></select></div>
<h2 id="title"></h2><p id="description"></p><p class="caption" id="count"></p><div class="box" id="results" role="tabpanel"></div>
<h2>분석 범위</h2><p id="scope"></p><details><summary>한계와 해석 기준</summary><ul id="limitations"></ul></details><ul id="warnings" class="warning"></ul>
</main>
<script type="application/json" id="report-data">__REPORT_DATA__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('report-data').textContent),$=id=>document.getElementById(id);
const make=(tag,text)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=String(text);return e;};
function details(label,items){const d=make('details');d.append(make('summary',label));d.addEventListener('toggle',()=>{if(!d.open||d.dataset.ready)return;d.dataset.ready='1';for(const v of items)d.append(make('pre',typeof v==='string'?v:JSON.stringify(v,null,2)));});return d;}
function cell(row,value){const td=make('td');td.append(value instanceof Node?value:document.createTextNode(String(value??'')));row.append(td);}
$('repo').textContent=D.repository+' · 커밋된 파일의 순변경';
$('revisions').textContent='base '+D.base+' → head '+D.head;
for(const [label,value] of [['변경 파일',D.summary.changed_files],['함수 변경',D.summary.changed_functions],['영향 후보 파일',D.summary.impact_files],['테스트 후보 파일',D.summary.test_files],['동시 수정 후보 파일',D.summary.cochange_candidates],['Git 분석 커밋',D.git_summary.analyzed_commits],['Git 작성자',D.git_summary.authors]]){const c=make('div');c.className='card';c.append(make('strong',value),make('small',label));$('stats').append(c);}
for(const x of D.limitations)$('limitations').append(make('li',x));
for(const x of D.warnings)$('warnings').append(make('li',x));
const H=D.cochanges.scope;
$('scope').textContent=`동시 수정 이력: base까지 ${H.analyzed_commits}/${H.reachable_commits} 커밋, 적격 ${H.pair_eligible_commits}개. 최소 동시 수정 ${D.cochanges.thresholds.min_support}회, 방향별 비율 ${(D.cochanges.thresholds.min_confidence*100).toFixed(0)}% 이상. 영향 탐색 깊이 ${D.limits.max_depth}, 시작 심볼당 노드 ${D.limits.max_nodes_per_root}개. 이력 상한 적용: ${H.truncated?'있음':'없음'}.`;
if(D.git_summary.github_api_enabled){$('scope').textContent+=` GitHub API 연결: ${D.git_summary.github_records}개 커밋 기록.`;}else{$('scope').textContent+=' PR·Issue·CI API는 이번 실행에서 사용하지 않음(--github-api로 선택).';}
const history=new Map(D.history_evidence.map(e=>[e.sha,e]));
const impacts=D.impacts.flatMap(r=>r.candidates.map(c=>({...c,side:r.side,changed:r.file+'::'+r.function,ambiguous:r.ambiguous_root})));
const relations=[...D.structure.added_relations.map(r=>({...r,side:'head',change:'추가'})),...D.structure.removed_relations.map(r=>({...r,side:'base',change:'제거'}))];
const sections={
 changes:{label:'변경 내용',title:'파일·함수·시그니처 변화',description:'최종 AST를 비교합니다. 시그니처 변경은 호출부 확인 신호이며 인자 호환성 오류 판정이 아닙니다. 함수 외부 변경과 분석 실패도 파일 목록에서 확인하세요.',headers:['파일 / 상태','함수 변화','진단'],rows:D.files,render:(r,tr)=>{cell(tr,details(r.path+' · '+r.status,[{before_path:r.old_path,after_path:r.path}]));cell(tr,r.functions.length?details(r.functions.length+'개 함수 — '+r.functions.map(f=>f.name).join(', '),r.functions.map(f=>({name:f.name,kind:f.kind,facts:f.facts,before_signature:f.before?.signature,after_signature:f.after?.signature}))):'함수 AST 순변경 없음 / 비교 불가 여부는 진단 참조');cell(tr,r.diagnostics.join('\n')||'—');}},
 structure:{label:'구조 비교',title:'호출·상속·포함 관계의 추가와 제거',description:D.structure.note+' 추가 심볼 '+D.structure.added_symbols.reduce((n,r)=>n+r.count,0)+'개, 제거 심볼 '+D.structure.removed_symbols.reduce((n,r)=>n+r.count,0)+'개. 심볼 상세는 JSON에서 확인할 수 있습니다.',headers:['시점 / 변화','출발 → 대상','관계와 근거'],rows:relations,render:(r,tr)=>{cell(tr,r.side+' · '+r.change);cell(tr,r.source.file+' :: '+r.source.name+' → '+r.target.file+' :: '+r.target.name);cell(tr,details(r.type+' · 근거 '+r.evidence.length+'개',r.evidence));}},
 impact:{label:'영향 후보',title:'직접·간접 호출부 검토 후보',description:'경로는 후보 호출자 → 변경 함수 순서입니다. base 경로는 삭제된 함수의 기존 호출부를 찾는 데도 사용됩니다. 파일이 함께 변경되어도 해당 호출부까지 수정됐다는 뜻은 아닙니다.',headers:['시점 / 변경 함수','영향 후보','거리 / 파일 변경','호출 경로'],rows:impacts,render:(r,tr)=>{cell(tr,r.side+' · '+r.changed+(r.ambiguous?' · 중복 정의 후보':''));cell(tr,r.file+' :: '+r.node.canonical_name);cell(tr,r.distance+'단계 · '+(r.file_changed?'변경 파일':'미변경 파일')+(r.is_test_file?' · 테스트 경로':''));cell(tr,details('근거 펼치기',r.path));}},
 tests:{label:'테스트 후보',title:'우선 확인할 테스트 파일',description:'정적 호출 경로를 우선하고 절대 import·파일명 규칙을 보조 근거로 제시합니다. 실제 테스트를 실행하지 않습니다. base 항목은 과거 참고용이며 현재 실행에는 head 항목을 확인하세요.',headers:['시점 / 파일','우선순위','추천 근거'],rows:D.test_candidates,render:(r,tr)=>{cell(tr,r.side+' · '+r.file);cell(tr,r.priority===1?'호출 경로 확인':'보조 근거');cell(tr,details(r.reasons.map(x=>x.type).filter((x,i,a)=>a.indexOf(x)===i).join(', '),r.reasons));}},
 cochange:{label:'동시 수정 후보',title:'함께 검토할 미변경 파일',description:D.cochanges.note,headers:['변경 파일 → 후보 파일','관측 횟수 / 비율','근거 커밋'],rows:D.cochanges.recommendations,render:(r,tr)=>{cell(tr,r.changed_file+' → '+r.candidate_file);cell(tr,r.support+' / '+r.source_change_count+'회 · '+(r.conditional_ratio*100).toFixed(1)+'%');cell(tr,details('근거 '+r.evidence_commits.length+'개',r.evidence_commits.map(sha=>history.get(sha)||{sha})));}}
};
let active='changes';
for(const [key,s] of Object.entries(sections)){const b=make('button',s.label);b.type='button';b.role='tab';b.dataset.key=key;b.addEventListener('click',()=>{active=key;render();});$('tabs').append(b);}
function render(){const s=sections[active],q=$('search').value.toLowerCase(),side=$('side').value;const sided=['structure','impact','tests'].includes(active);$('side').disabled=!sided;for(const b of $('tabs').children)b.setAttribute('aria-selected',String(b.dataset.key===active));$('title').textContent=s.title;$('description').textContent=s.description;const filtered=s.rows.filter(r=>(!sided||!side||r.side===side)&&(!q||JSON.stringify(r).toLowerCase().includes(q)));$('count').textContent=filtered.length+' / '+s.rows.length+'개 항목';$('results').replaceChildren();if(!filtered.length){const empty=make('p','조건에 맞는 결과가 없습니다. 변경이 없거나 분석 근거·과거 표본이 부족할 수 있습니다.');empty.className='empty';$('results').append(empty);return;}const table=make('table'),thead=make('thead'),hr=make('tr'),body=make('tbody');for(const h of s.headers)hr.append(make('th',h));thead.append(hr);for(const r of filtered){const tr=make('tr');s.render(r,tr);body.append(tr);}table.append(thead,body);$('results').append(table);}
$('search').addEventListener('input',render);$('side').addEventListener('change',render);render();
</script></body></html>
